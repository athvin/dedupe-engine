name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Incremental compilation only bloats CI caches: every run starts from the
  # restored cache, never from its own previous incremental state.
  CARGO_INCREMENTAL: "0"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Cache strategy: the four cargo jobs below all build the same dev-profile
# dependency set (dominated by the bundled DuckDB C++), so they share ONE
# rust-cache entry (`shared-key: dev`) instead of four near-identical
# multi-GB caches competing for the repo's cache quota. `cache-on-failure`
# keeps a long cold build from being thrown away just because a later step
# failed (a red clippy run used to discard the whole DuckDB build).

jobs:
  lint:
    name: fmt + clippy + docs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: dev
          cache-on-failure: true
      - run: cargo fmt --all --check
      # --all-targets also gates that benches and examples still compile; the
      # old standalone "benchmarks (compile)" job built a second,
      # release-profile DuckDB for no additional signal.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: rustdoc (deny warnings)
        run: cargo doc --workspace --no-deps --document-private-items --locked
        env:
          RUSTDOCFLAGS: "-D warnings"

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: dev
          cache-on-failure: true
      - uses: taiki-e/install-action@nextest
      # nextest runs the ~20 integration-test binaries in parallel; plain
      # `cargo test` runs them one binary at a time.
      - run: cargo nextest run --workspace --locked
      # nextest does not run doctests; keep them covered (currently zero, and
      # this is free once the build is cached).
      - run: cargo test --workspace --doc --locked

  security:
    name: cargo-deny (advisories + licenses + bans)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources

  ducklake-e2e:
    name: DuckLake + extensions e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DEDUPE_E2E_DUCKLAKE: "1"
      DEDUPE_E2E_EXTENSIONS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: dev
          cache-on-failure: true
      - uses: taiki-e/install-action@nextest
      - name: Cache DuckDB extensions
        uses: actions/cache@v4
        with:
          path: ~/.duckdb/extensions
          key: duckdb-extensions-${{ hashFiles('Cargo.toml') }}
      - run: cargo nextest run -p dedupe-cli --locked
      - name: Extension loading (rapidfuzz)
        run: cargo nextest run -p dedupe-core --test extensions --locked

  scale-tests:
    name: scale golden (50k)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DEDUPE_SCALE_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: dev
          cache-on-failure: true
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run -p dedupe-core --test golden_historical_50k --locked
